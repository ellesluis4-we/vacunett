<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VacuNet · Administración</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600&display=swap');
:root{--azul:#0E5FA8;--oscuro:#0A3D6E;--teal:#0EA5A0;--dorado:#F5A623;--fondo:#F5F9FC;--borde:#DCE7EF;--texto:#0B2540;--suave:#4C6178}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--fondo);color:var(--texto)}
h1,h2,h3{font-family:'Baloo 2',sans-serif;color:var(--oscuro);margin:0 0 .5em}
header{background:#fff;border-bottom:1px solid var(--borde);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
main{max-width:1000px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:24px;margin-bottom:20px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:10px 20px;font:600 .95rem Inter;cursor:pointer;color:var(--suave)}
.tabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:10px;font:inherit;background:#fff}
input[type=checkbox]{width:auto}textarea{min-height:90px;resize:vertical}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button.p{background:var(--teal);color:#fff;border:0;border-radius:999px;padding:11px 24px;font:600 1rem 'Baloo 2';cursor:pointer;margin-top:16px}
button.s{background:#fff;border:1px solid var(--borde);border-radius:999px;padding:6px 14px;font:500 .85rem Inter;cursor:pointer}
button.d{color:#B3261E}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:10px 8px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:middle}
.mini{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--fondo)}
.off{opacity:.5}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--oscuro);color:#fff;padding:12px 22px;border-radius:999px;display:none;z-index:9}
.hide{display:none}#login{max-width:380px;margin:12vh auto}
:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
</style>
</head>
<body>
<div id="login" class="card">
  <h1>Administración VacuNet</h1>
  <p style="color:var(--suave)">Ingresa con la cuenta de dueño del centro.</p>
  <form id="f-login"><label>Correo</label><input type="email" id="l-mail" required>
  <label>Contraseña</label><input type="password" id="l-pass" required>
  <button class="p" style="width:100%">Entrar</button></form>
</div>

<div id="panel" class="hide">
<header><strong style="font-family:'Baloo 2';color:var(--oscuro)">VacuNet · Administración</strong>
<span><a href="index.html" target="_blank">Ver sitio</a> &nbsp; <button class="s" id="salir">Cerrar sesión</button></span></header>
<main>
<div class="tabs"><button data-t="cat" class="on">Catálogo y promociones</button><button data-t="cont">Contenido del sitio</button><button data-t="res">Resultados</button></div>

<section id="t-cat">
  <div class="card"><h2 id="cat-titulo">Agregar al catálogo</h2>
  <form id="f-cat"><input type="hidden" id="c-id">
    <div class="fila"><div><label>Nombre</label><input id="c-nombre" required></div>
    <div><label>Tipo</label><select id="c-cat"><option value="vacuna">Vacuna</option><option value="producto">Producto</option></select></div></div>
    <label>Descripción</label><textarea id="c-desc"></textarea>
    <div class="fila"><div><label>Precio (COP)</label><input type="number" id="c-precio" min="0" placeholder="Vacío = consultar"></div>
    <div><label>Descuento (%)</label><input type="number" id="c-dcto" min="0" max="100" value="0"></div>
    <div><label>Texto de promoción</label><input id="c-promo" placeholder="Ej: Oferta para estudiantes"></div>
    <div><label>Orden</label><input type="number" id="c-orden" value="0"></div></div>
    <label>Imagen</label><input type="file" id="c-img" accept="image/*">
    <label><input type="checkbox" id="c-activo" checked> Visible en el sitio</label>
    <button class="p">Guardar</button> <button type="button" class="s" id="c-cancel">Limpiar</button>
  </form></div>
  <div class="card"><h2>Catálogo actual</h2><table id="lista-cat"></table></div>
</section>

<section id="t-cont" class="hide"><div class="card"><h2>Textos e imágenes de la página principal</h2>
  <form id="f-cont"></form></div></section>

<section id="t-res" class="hide">
  <div class="card"><h2>Subir resultado</h2><form id="f-res">
    <div class="fila"><div><label>Documento</label><input id="r-doc" required inputmode="numeric"></div>
    <div><label>Nombre del paciente</label><input id="r-nombre" required></div>
    <div><label>Vacuna</label><select id="r-vacuna"></select></div>
    <div><label>Dosis</label><input type="number" id="r-dosis" min="1" value="1"></div>
    <div><label>Fecha</label><input type="date" id="r-fecha" required></div>
    <div><label>Estado</label><select id="r-estado"><option>Aplicada</option><option>Pendiente</option><option>Programada</option></select></div></div>
    <button class="p">Guardar resultado</button></form></div>
  <div class="card"><h2>Últimos resultados</h2><table id="lista-res"></table></div>
</section>
</main></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COP = n => n == null ? '—' : '$' + Number(n).toLocaleString('es-CO');
const aviso = t => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2600); };
const CAMPOS = [['hero_titulo','Título principal','text'],['hero_subtitulo','Subtítulo','text'],['hero_imagen','Imagen principal','img'],
 ['mision','Misión','area'],['vision','Visión','area'],['horario_dias','Días de atención','text'],['horario_horas','Horas de atención','text'],
 ['telefonos','Teléfonos','text'],['correo','Correo de contacto','text'],['promo_banner_texto','Texto del banner de promoción','text'],['promo_banner_activo','Mostrar el banner de promoción','bool']];
let catalogo = [];

async function subir(file) {
  const ruta = Date.now() + '-' + file.name.replace(/[^\w.]/g, '_');
  const { error } = await db.storage.from('imagenes').upload(ruta, file, { upsert: true });
  if (error) throw error;
  return db.storage.from('imagenes').getPublicUrl(ruta).data.publicUrl;
}

async function entrar() {
  const { data } = await db.from('admins').select('user_id').maybeSingle();
  if (!data) { alert('Esta cuenta no tiene permisos de administrador.'); await db.auth.signOut(); return; }
  $('#login').classList.add('hide'); $('#panel').classList.remove('hide');
  await cargarCat(); cargarCont(); cargarRes();
}

$('#f-login').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: $('#l-mail').value, password: $('#l-pass').value });
  if (error) return alert('Correo o contraseña incorrectos.');
  entrar();
};
$('#salir').onclick = async () => { await db.auth.signOut(); location.reload(); };
db.auth.getSession().then(({ data }) => { if (data.session) entrar(); });

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['cat','cont','res'].forEach(t => $('#t-' + t).classList.toggle('hide', t !== b.dataset.t));
});

// ----- Catálogo -----
async function cargarCat() {
  const { data } = await db.from('vacunas').select('*').order('orden');
  catalogo = data || [];
  $('#lista-cat').innerHTML = '<tr><th></th><th>Nombre</th><th>Precio</th><th>Promoción</th><th></th></tr>' + catalogo.map(v => `
    <tr class="${v.activo ? '' : 'off'}"><td>${v.imagen_url ? `<img class="mini" src="${esc(v.imagen_url)}" alt="">` : '💉'}</td>
    <td>${esc(v.nombre)}<br><small>${v.categoria}${v.activo ? '' : ' · oculto'}</small></td><td>${COP(v.precio)}</td>
    <td>${v.descuento_pct ? v.descuento_pct + '% ' : ''}${esc(v.promo_texto || '')}</td>
    <td><button class="s" onclick="editar(${v.id})">Editar</button> <button class="s d" onclick="borrar(${v.id})">Eliminar</button></td></tr>`).join('');
  $('#r-vacuna').innerHTML = catalogo.map(v => `<option>${esc(v.nombre)}</option>`).join('');
}
function editar(id) {
  const v = catalogo.find(x => x.id === id);
  $('#cat-titulo').textContent = 'Editar: ' + v.nombre;
  $('#c-id').value = v.id; $('#c-nombre').value = v.nombre; $('#c-cat').value = v.categoria; $('#c-desc').value = v.descripcion || '';
  $('#c-precio').value = v.precio ?? ''; $('#c-dcto').value = v.descuento_pct || 0; $('#c-promo').value = v.promo_texto || '';
  $('#c-orden').value = v.orden; $('#c-activo').checked = v.activo; scrollTo({ top: 0, behavior: 'smooth' });
}
function limpiar() { $('#f-cat').reset(); $('#c-id').value = ''; $('#cat-titulo').textContent = 'Agregar al catálogo'; }
$('#c-cancel').onclick = limpiar;
$('#f-cat').onsubmit = async e => {
  e.preventDefault();
  try {
    const fila = { nombre: $('#c-nombre').value, categoria: $('#c-cat').value, descripcion: $('#c-desc').value,
      precio: $('#c-precio').value === '' ? null : +$('#c-precio').value, descuento_pct: +$('#c-dcto').value || 0,
      promo_texto: $('#c-promo').value || null, orden: +$('#c-orden').value || 0, activo: $('#c-activo').checked };
    if ($('#c-img').files[0]) fila.imagen_url = await subir($('#c-img').files[0]);
    const id = $('#c-id').value;
    const { error } = id ? await db.from('vacunas').update(fila).eq('id', id) : await db.from('vacunas').insert(fila);
    if (error) throw error;
    aviso('Catálogo guardado'); limpiar(); cargarCat();
  } catch (err) { alert('No se pudo guardar: ' + err.message); }
};
async function borrar(id) {
  if (!confirm('¿Eliminar este elemento del catálogo?')) return;
  await db.from('vacunas').delete().eq('id', id); aviso('Eliminado'); cargarCat();
}

// ----- Contenido del sitio -----
async function cargarCont() {
  const { data } = await db.from('contenido').select('*');
  const c = Object.fromEntries((data || []).map(r => [r.clave, r.valor]));
  $('#f-cont').innerHTML = CAMPOS.map(([k, t, tipo]) => tipo === 'area' ? `<label>${t}</label><textarea data-k="${k}">${esc(c[k])}</textarea>`
    : tipo === 'bool' ? `<label><input type="checkbox" data-k="${k}" ${c[k] === 'true' ? 'checked' : ''}> ${t}</label>`
    : tipo === 'img' ? `<label>${t}</label>${c[k] ? `<img class="mini" style="width:120px;height:auto" src="${esc(c[k])}" alt=""><br>` : ''}<input type="file" accept="image/*" data-k="${k}" data-img="1">`
    : `<label>${t}</label><input data-k="${k}" value="${esc(c[k])}">`).join('') + '<button class="p">Guardar cambios del sitio</button>';
}
$('#f-cont').onsubmit = async e => {
  e.preventDefault();
  try {
    const filas = [];
    for (const el of document.querySelectorAll('#f-cont [data-k]')) {
      if (el.dataset.img) { if (el.files[0]) filas.push({ clave: el.dataset.k, valor: await subir(el.files[0]) }); }
      else filas.push({ clave: el.dataset.k, valor: el.type === 'checkbox' ? String(el.checked) : el.value });
    }
    const { error } = await db.from('contenido').upsert(filas);
    if (error) throw error;
    aviso('Sitio actualizado'); cargarCont();
  } catch (err) { alert('No se pudo guardar: ' + err.message); }
};

// ----- Resultados -----
async function cargarRes() {
  const { data } = await db.from('resultados').select('*').order('id', { ascending: false }).limit(50);
  $('#lista-res').innerHTML = '<tr><th>Documento</th><th>Paciente</th><th>Vacuna</th><th>Dosis</th><th>Fecha</th><th>Estado</th><th></th></tr>' +
    (data || []).map(r => `<tr><td>${esc(r.documento)}</td><td>${esc(r.nombre)}</td><td>${esc(r.vacuna)}</td><td>${r.dosis}</td><td>${r.fecha}</td><td>${esc(r.estado)}</td>
    <td><button class="s d" onclick="borrarRes(${r.id})">Eliminar</button></td></tr>`).join('');
}
$('#f-res').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.from('resultados').insert({ documento: $('#r-doc').value.trim(), nombre: $('#r-nombre').value, vacuna: $('#r-vacuna').value,
    dosis: +$('#r-dosis').value, fecha: $('#r-fecha').value, estado: $('#r-estado').value });
  if (error) return alert('No se pudo guardar: ' + error.message);
  aviso('Resultado guardado'); $('#f-res').reset(); cargarRes();
};
async function borrarRes(id) { if (confirm('¿Eliminar este resultado?')) { await db.from('resultados').delete().eq('id', id); cargarRes(); } }
</script>
</body></html>
